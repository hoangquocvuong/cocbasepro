workflows:
  ios-release:
    name: iOS Release Build

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - flutter clean

      - flutter pub get

      - |
        cd ios
        pod install
        cd ..

      - flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa