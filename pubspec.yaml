name: cocbasepro
description: Coc Base Pro App
publish_to: "none"

version: 1.0.0+19

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.8.0

  # Network check
  connectivity_plus: ^6.0.5

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.0

  # Open external links
  url_launcher: ^6.3.2

  # Ads
  google_mobile_ads: ^5.1.0

  # Review app
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Splash + Icon generator
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icon_ios.png


# =========================
# SPLASH SCREEN CONFIG
# =========================
flutter_native_splash:
  color: "#1E88F0"
  image: assets/icon.png
  fullscreen: true

  android: true
  ios: true

  android_12:
    color: "#1E88F0"
    image: assets/icon.png


# =========================
# APP ICON CONFIG
# =========================
flutter_launcher_icons:
  android: true
  ios: true

  # Android adaptive icon
  image_path_android: "assets/icon.png"

  adaptive_icon_background: "#1E88F0"
  adaptive_icon_foreground: "assets/icon.png"

  # iOS icon
  image_path_ios: "assets/icon_ios.png"

  remove_alpha_ios: true