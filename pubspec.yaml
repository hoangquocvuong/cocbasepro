name: cocbasepro

description: Coc Base Pro App

publish_to: "none"

version: 1.0.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WEBVIEW
  webview_flutter: ^4.8.0
  webview_flutter_wkwebview: ^3.14.0

  # INTERNET
  connectivity_plus: ^6.0.5

  # URL
  url_launcher: ^6.3.2

  # ADMOB
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png