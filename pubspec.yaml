name: cocbasepro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🔥 ICON GENERATOR
  flutter_launcher_icons: ^0.14.0

flutter:

  uses-material-design: true

  # (optional) nếu bạn dùng asset trong app
  assets:
    - assets/icon.png

# 🔥 ICON CONFIG (CHUẨN MỚI 2026)
flutter_launcher_icons:
  android: true
  ios: true

  windows:
    generate: true

  image_path: "assets/icon.png"
  remove_alpha_ios: true